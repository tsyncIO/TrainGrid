name: Kaggle System Report

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  system_report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure Kaggle API Token for new Kaggle CLI
        run: |
          mkdir -p ~/.kaggle
          echo "${{ secrets.KAGGLE_KEY }}" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
          echo "KAGGLE_API_TOKEN=${{ secrets.KAGGLE_KEY }}" >> $GITHUB_ENV

      - name: Run Kaggle System Report
        uses: KevKibe/kaggle-script-action@v1.0.5
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        with:
          username: ${{ secrets.KAGGLE_USERNAME }}
          key: ${{ secrets.KAGGLE_KEY }}
          title: "TrainGrid System Report"
          custom_script: "python src/system_report.py"
          enable_gpu: false
          enable_internet: true
          sleep_time: 15
